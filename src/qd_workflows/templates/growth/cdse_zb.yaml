# Growth-model parameters: every value is a PLACEHOLDER until the shape-library fits replace it.
conditions:
  T: 500.0
  c_P0: 0.1
  c_MX0: 0.2
  k_conv_500K: 1.0
  Ea_conv: 0.0
  t_end: 600.0
  t_start: 0.001
  n_out: 60
material:
  Omega_m: 59.667492978136295
  g_bulk: -5.4903
  omega_E_cm1: 150.0
  atoms_per_unit: 2
  m0: auto
  m0_min: 10
  m_dissolve: 4
  N_min: 1.0e-15
  match_m0: false
nucleation:
  flux: becker_doring
  attach_barrier_eV: 0.0
  J0: 1.0e-06
kinetics:
  mu_small: grid
  D: 1.0e-05
  k_r: facets
  growth_law: shape
  beta_scale: 1.0
  facets:
    '100':
      k_f: 11000.0
      island_beta_eV: 1.08
    111A:
      k_f: 4.2e+11
    111B:
      k_f: 770.0
      island_beta_eV: 1.027
    '110':
      k_f: 2.4e+11
families:
  '100':
    gamma0: 11.3
    eps0: 1.38
    Gamma_max: 3.05
    w: 0.738
    tau: 14.0
    k0: 10000.0
    x_X: 0.0
    site_area: 19.238381192648
  111A:
    gamma0: 25.3
    eps0: 1.06
    Gamma_max: 1.26
    w: 0.305
    tau: 14.0
    k0: 10000.0
    x_X: 0.0
    site_area: 16.660926840521935
  111B:
    gamma0: 21.9
    eps0: 1.08
    Gamma_max: 0.66
    w: 0.16
    tau: 14.0
    k0: 10000.0
    x_X: 0.0
    site_area: 16.660926840521935
  '110':
    gamma0: 21.5
    eps0: 1.28
    Gamma_max: 1.21
    w: 0.293
    tau: 14.0
    k0: 10000.0
    x_X: 0.0
