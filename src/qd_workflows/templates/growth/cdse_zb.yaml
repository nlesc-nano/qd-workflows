provenance:
  families: 'per-site-class refit (2026-10-27) of the 92 QD_builder library dots with >= 100 atoms (MACE-MH-1 omat_pbe,
    rattle-polished bases; rms 15 meV/atom saturated, 10 meV/atom bare). CdCl2 counted per site class of the facet-net
    partition (facet centre / edge / vertex): centre units by the Fowler-Guggenheim shell of each facet, edge and vertex
    units with their own fitted binding (1.0-1.1 eV, as the measured local removals). Gamma_max: Z-type sites per
    atom-fitted area from the site counts ({100} 10 CdCl2 per face, bridging Cl above the Cd layer; {111}A ~0.25 per Cd,
    none in the centre; {111}B 13 per 21 Se; {110} 0.8-0.9 per Se). eps0, w: {100} and {111}A from greedy strips within
    the facet''s own Cl on the polished 3x3x3 dot (eps0 refitted with the library), {111}B and {110} eps0 from
    zero-coverage intact Z-type additions on facet centres; gamma0 fitted jointly, gamma > 0 at all coverages'
  sites: 'site classes of the half-swap 2.5^3 dot (801 atoms, MACE-MH-1 omat_pbe, 500 K, 1 M; 2026-10-28/29): n the
    surface Cd of the class on that dot, per_area = n / construction area, per_length = n / the family''s perimeter
    (100: 1448.8 A^2, 372.9 A; 111A, 111B: 1194.3 A^2, 264.8 A; perimeter_per_area_ref their ratio); the 100|111A edge
    classes count on both families. dG_bind: CdCl2 release umbrellas (100 centre next to 111B: Tier 1, its umbrella
    failed twice); dW_dir: CdSe.CdCl2 attachment umbrellas (barrier over the free plateau; each 100|111A edge class
    from its own run, 2026-10-29); dW_disp (direct exchange umbrellas) left out for now: their
    end states lie 0.8-2.3 eV above what the separate umbrellas give (111B centre barrier 1.35 +- 0.08 eV, held back
    until that is diagnosed), so no class has a direct exchange yet. Capture areas of the restraint cylinders: attachment 2 A, exchange 3.5 A,
    both 2 eV/A^2. gamma stays on the fit below until gamma_eff from the layer additions replaces it.'
  conditions: 'default synthesis: 0.025 M Se precursor, 0.03 M CdCl2, 500 K'
  shell_offset: 'the same 108 dots (builder geometries): R_h = capacitance of the van der Waals body (CdCl2 included),
    R_se = solvent-excluded radius (2 A probe), against the convex hull of the Cd/Se core scaled to m Omega_m;
    dR = a + b sigma (A), sigma = k / A_P (MX_q per A^2), rms 0.37 A (R_h) and 0.32 A (R_se), 3 % of R_h'
  g_bulk_T: 'MACE-MH-1 omat_pbe float64 zinc blende (a = 6.2030 A): E_bulk + harmonic phonon F_vib, 6x6x6 supercell,
    DOS on 24^3 q (supercell 4-6 within 1.6 meV, quasi-harmonic within 1 meV at 500 K). CP2K PBE/DZVP check (2026-10-26):
    a = 6.216 A; CdCl2-capped clusters vs bulk within 0.02 eV per CdSe, the pool complex CdSe.CdCl2 0.11 eV higher in CP2K
    (single points at MACE geometries). g_bulk and omega_E_cm1 above are used only without this table.'
  facets: 'k_f: single-unit NEB + Hessians on builder dots (500 K, geometric mean of the sites, collision-capped);
    island_beta_eV: island ladders N = 1-9 with CdCl2 released to the pool (facet_kinetics, island_release)'
  roles: 'per-facet size law (kinetics.size_law: facets, off by default; 2026-10-30), computed values only. envs: per
    builder role and computed dot (m = 13 Cd16Se13Cl6 grid hand-off, 45 Cd68Se45Cl46, 127/279/441 the half-swap 2.0/2.5/3.0
    dots), each environment [n Cd, Delta mu (eV, a_X = 1, Delta k = -1, = G(M) - G(ref) + G_CdCl2(1 M) - g_bulk), CdCl2
    binding dG_bind_X (eV, 1 M)]; MACE-MH-1 omat_pbe, relaxed context + PHVA, 500 K (role_table_1to3.json: job 23283088
    for 1.0/1.5, the site-state runs for 2.0-3.0). neb: bare-CdSe NEB on the 2.5 dot, one site per role (largest
    environment), dG_P / dG_TS against free CdSe at 1 M; no_barrier = collision-limited; edge 100|111B converged climbing
    images, the others +-0.1 eV. Not covered by a NEB: edge 111A|111B (3.0 only): no channel. rate_form: not set (the
    velocity form is a choice: second_order or first_order)'
