units:
  gamma0: meV/A^2 (bare facet)
  tau: meV/A
  eps0: 'eV per Z-type MX_q on the empty facet (> 0: bound)'
  dG_bind: eV per Z-type MX_q at 1 M (if given instead of eps0)
  Gamma_max: Z-type MX_q per nm^2
  w: eV (lateral interaction at full coverage)
  k0: A/s
  k_r: 'A/s, or "facets": each dot''s surface reaction from the facet rates, sum_f A_f k_f (1 - theta_f) / A'
  k_f: A/s (facet incorporation rate, relative speeds of the shape rule)
  island_beta_eV: eV (step term of the island ladder, dG(N) = g N + beta sqrt(N))
  sites: 'per class: n (count on the reference dot), per_area 1/A^2 or per_length 1/A, dG_bind eV at 1 M, dW_dir and
    dW_disp eV (umbrella barriers over the free plateau), active (default true)'
  A_dir_A2: A^2 (capture area of the attachment umbrella)
  A_disp_A2: A^2 (capture area of the exchange umbrella)
  gamma_eff: meV/A^2 (from the dots' layer additions, MX_q at 1 M)
  Gamma_eff: MX_q per nm^2 (excess of the layer additions; gamma = gamma_eff - Gamma_eff kT ln c)
  perimeter_per_area_ref: 1/A (the reference dot's facet perimeter over area)
  size_law: '"facets": dm/dt = n sum_r g_r (C - C_eq,inf e^(Delta mu_r/kT)), g_r = N_r w_rf / (delta/D / a_0 + 1/kappa_r),
    channels r = builder roles on each facet f (w_rf 1, 1/2, 1/3), Delta mu_r the Cd-weighted mean over the role''s
    environments; else the one-flux size law'
  roles: 'envs per role and m: [n Cd, Delta mu eV at a_X = 1, dG_bind_X eV at 1 M]; neb per role: dir and disp routes,
    dG_P and dG_TS eV against the bare CdSe at 1 M or no_barrier, applied to every arriving monomer; rate_form second_order (TS against 1 M) or first_order
    (saturating precursor), required with size_law facets'
  site_area: A^2
  J0: M/s
  attach_barrier_eV: eV
  T: K
  c_P0: M
  c_MX0: M
  k_conv_500K: 1/(M s)
  Ea_conv: eV
  t_end: s
