provenance:
  families: fit of 108 QD_builder dots (MACE-MH-1)
  facets: 'k_f: single-unit NEB + Hessians on builder dots (500 K, geometric mean of the sites, collision-capped);
    island_beta_eV: island ladders N = 1-9 with CdCl2 released to the pool (facet_kinetics, island_release)' 
solvation:
  eps: 2.0
  vdw_scale: 1.4
  e_el_eV_A2: -0.00106
  monomers:
    CdSe:
      E_inf_eV: -0.327178
      S_A2: 117.799
    CdCl2:
      E_inf_eV: -0.198261
      S_A2: 135.843
  complexes:
    '1':
      E_inf_eV: -0.279721
      S_A2: 208.647
    '2':
      E_inf_eV: -0.461963
      S_A2: 287.318
    '3':
      E_inf_eV: -0.51139
      S_A2: 351.68
  note: implicit solvent only; explicit solvent and ligands (oleic acid, amines, phosphines)
    come later
units:
  gamma0: meV/A^2 (bare facet)
  tau: meV/A
  eps0: 'eV per Z-type MX_q on the empty facet (> 0: bound)'
  dG_bind: eV per Z-type MX_q at 1 M (if given instead of eps0)
  Gamma_max: Z-type MX_q per nm^2
  w: eV (lateral interaction at full coverage)
  k0: A/s
  k_r: 'A/s, or "facets": each dot''s surface reaction from the facet rates, sum_f A_f k_f (1 - theta_f) / A'
  k_f: A/s (facet incorporation rate, relative speeds of the shape rule)
  island_beta_eV: eV (step term of the island ladder, dG(N) = g N + beta sqrt(N))
  D: cm^2/s
  x_X: X-type MX_q per surface site (electron counting)
  site_area: A^2
  J0: M/s
  attach_barrier_eV: eV
  T: K
  c_P0: M
  c_MX0: M
  k_conv_500K: 1/(M s)
  Ea_conv: eV
  t_end: s
