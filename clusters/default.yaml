# First HPC cluster (CPU nodes shared between jobs). Copy this file for another
# cluster and change what differs.
name: default
scheduler: slurm
cores_per_node: 48
# "cores": nodes are shared, a job asks for a core count (-n); "nodes": a job
# asks for whole nodes and cores are rounded up to cores_per_node.
request: cores
min_cores: 48
mem_per_cpu: 2g
qos: regular
# Run at the top of every job script: a job submitted from a non-login shell
# (ssh host 'sbatch ...') does not inherit the `module` function.
setup:
  - source /etc/profile.d/lmod.sh
# Python with qd_workflows installed, for the qdw calls inside CP2K chain jobs.
qdw_python: /dipc/iinfante/.conda/envs/qdw-compute/bin/python

cp2k:
  module: CP2K/2026.2-foss-2025a
  executable: cp2k.popt
  omp_num_threads: 1
  data_dir: /scratch/iinfante/cp2k_basis
  basis_file: BASIS_MOLOPT_UZH
  potential_file: POTENTIAL_UZH
  basis: DZVP-MOLOPT-GGA-GTH        # + -q<valence charge>, read from the basis file
  potential: GTH-GGA                # + -q<valence charge>
  # Wall time per step (placeholders until measured).
  time:
    geo_opt: "24:00:00"
    pdos: "06:00:00"
    trexio: "06:00:00"
    sample: "02:00:00"
    chain: "48:00:00"               # geo_opt + pdos + trexio in one job
  # Cores and memory grow with the square of the basis-function count,
  # calibrated on a 4.2 nm CdSe dot (~1,300 atoms).
  calibration:
    basis_functions: 24000
    cores: 240
    memory_gb: 340

# QDEX, the last step of the CP2K chain (CPU, first node of the chain job).
qdex:
  command: /dipc/iinfante/.conda/envs/qdex/bin/qdex      # envs/qdex.yml + pip install -e QDEX
  gth_soc_file: /scratch/iinfante/cp2k_basis/GTH_SOC_POTENTIALS_2024   # copy of QDEX tests/ (update of 02.04.2024)
  max_states: 1000          # occupied and virtual MOs in the diagonal sBSE (balanced, capped by the window)
  eps_out: 2.24             # toluene
  # CIFs (fuzzy bands) come from props.cif_dirs unless qdex.cif_dirs is set.

# GPU jobs (Orchestr.AI run_type PROPS). Paths are the Phase 0 test layout.
props:
  partition: general
  gres: gpu:1
  constraint: a100         # hyperion: the GPU model goes in --constraint, not --gres
  cpus: 16                 # g-xTB / GFN2-xTB run on these while the GPU does MACE
  mem: 64G
  time: "01:00:00"
  conda_init: source /scicomp/builds/Rocky/8.7/Common/software/Mamba/23.11.0-0/etc/profile.d/conda.sh
  conda_env: qdw-compute
  model: /scratch/iinfante/escience/qdw-test/models/macemh1model
  head: omat_pbe
  gxtb: /scratch/iinfante/xtb/xtb-6.7.1/bin/gxtb
  cif_dirs:
    - /scratch/iinfante/escience/qdw-test/QD_Builder/examples/cifs
    - /scratch/iinfante/escience/qdw-test/QD_Builder/examples/library/cifs
  refs: /scratch/iinfante/escience/qdw-test/references
