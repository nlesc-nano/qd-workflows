site_name: qd-workflows
site_description: Workflows that tie the quantum-dot packages together (QD_builder, Orchestr.AI, CP2K, QDEX)
repo_url: https://github.com/nlesc-nano/qd-workflows
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Pipeline:
      - Overview: pipeline/overview.md
      - 1 · GPU stage (MACE-MH-1): pipeline/gpu-stage.md
      - 2 · CP2K chain: pipeline/cp2k-chain.md
      - 3 · CPU stage (assembly): pipeline/cpu-stage.md
      - QDEX: pipeline/qdex.md
  - Theory:
      - Thermochemistry: theory/thermochemistry.md
      - Solvation: theory/solvation.md
      - Reactions and equilibria: theory/equilibria.md
      - IR and Raman: theory/spectra.md
  - Reaction free energies (qdw reaction): reactions.md
  - Reference:
      - Command line: reference/cli.md
      - Cluster profiles: reference/clusters.md
      - Output files: reference/outputs.md
      - Reproducibility and caching: reference/reproducibility.md
      - Validation (Phase 0, benchmark): reference/validation.md
      - Phase 0 runbook: phase0_runbook.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
